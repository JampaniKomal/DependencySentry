[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dependency-sentry"
version = "2.0.0"
description = "Audit a Python project's full dependency tree against OSV.dev, and export it as a CycloneDX SBOM"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Jampani Komal" }]
dependencies = [
    "PyQt6>=6.7",
    "qtawesome>=1.3",
    "requests>=2.33",
    "packaging>=24",
    "pip>=23",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "cyclonedx-python-lib[json-validation]>=8"]

[project.scripts]
dependency-sentry = "dependency_sentry.cli:main"

[project.gui-scripts]
dependency-sentry-gui = "dependency_sentry.app:main"

[tool.setuptools.packages.find]
include = ["dependency_sentry*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["dependency_sentry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: talks to PyPI and OSV.dev (run with DEPENDENCY_SENTRY_NETWORK=1)"]
