name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"  # weekly: the live test notices OSV or PyPI API changes

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Qt's system libraries (headless)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: "Tests (offline: PyPI and OSV.dev are faked)"
        run: python -m pytest -q

  live:
    # Against the real services: pip's resolver, PyPI and OSV.dev.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install -e ".[dev]"

      - name: Live end-to-end test
        env:
          DEPENDENCY_SENTRY_NETWORK: "1"
        run: python -m pytest -q -m network tests/test_audit_export.py

      - name: Audit the example manifests and validate the SBOM
        run: |
          code=0; dependency-sentry examples/vulnerable-requirements.txt --sbom sbom.cdx.json || code=$?
          test "$code" -eq 1   # vulnerabilities found
          dependency-sentry examples/old-transitive-requirements.txt --fail-on none
          python - <<'PY'
          import json
          from cyclonedx.schema import SchemaVersion
          from cyclonedx.validation.json import JsonStrictValidator
          errors = JsonStrictValidator(SchemaVersion.V1_6).validate_str(open("sbom.cdx.json").read())
          assert errors is None, errors
          bom = json.load(open("sbom.cdx.json"))
          print(len(bom["components"]), "components,", len(bom.get("vulnerabilities", [])), "vulnerabilities; schema valid")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: example-sbom
          path: sbom.cdx.json
